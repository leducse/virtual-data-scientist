name: Verify analytics workspace
on:
  push:
    branches: [main, feat/product-experience-v2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: python -m pip check
      - run: npm ci --ignore-scripts --no-fund && npm audit --omit=dev
        working-directory: aws_backend/streaming
      - run: git diff --check
