<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Data Scientist Architecture</title>
  <desc id="desc">Architecture diagram showing the consulting website or MCP client calling the Virtual Data Scientist MCP/API facade, light analysis, deep analysis, AgentCore runtime, authenticated backend, state store, and artifact store.</desc>
  <defs>
    <style>
      .bg { fill: #08111f; }
      .lane { fill: #0f1f35; stroke: #233a58; stroke-width: 1.5; }
      .box { fill: #13263f; stroke: #38bdf8; stroke-width: 1.6; rx: 14; }
      .box2 { fill: #172554; stroke: #818cf8; stroke-width: 1.6; rx: 14; }
      .box3 { fill: #052e2b; stroke: #2dd4bf; stroke-width: 1.6; rx: 14; }
      .warn { fill: #422006; stroke: #f59e0b; stroke-width: 1.6; rx: 14; }
      .title { fill: #e5f6ff; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #93a4b8; font: 15px Arial, sans-serif; }
      .label { fill: #f8fafc; font: 700 16px Arial, sans-serif; }
      .small { fill: #cbd5e1; font: 13px Arial, sans-serif; }
      .tiny { fill: #94a3b8; font: 12px Arial, sans-serif; }
      .arrow { stroke: #67e8f9; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #a5b4fc; stroke-width: 2.2; fill: none; marker-end: url(#arrow2); stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9" />
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a5b4fc" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720" />
  <text x="640" y="54" text-anchor="middle" class="title">Virtual Data Scientist</text>
  <text x="640" y="82" text-anchor="middle" class="subtitle">Light analysis now, deeper AgentCore analysis later, with persisted code, artifacts, and context</text>

  <rect x="52" y="128" width="250" height="470" rx="18" class="lane" />
  <text x="177" y="160" text-anchor="middle" class="subtitle">Client Surfaces</text>

  <rect x="355" y="128" width="300" height="470" rx="18" class="lane" />
  <text x="505" y="160" text-anchor="middle" class="subtitle">Application Facade</text>

  <rect x="708" y="128" width="520" height="470" rx="18" class="lane" />
  <text x="968" y="160" text-anchor="middle" class="subtitle">AWS Runtime And Durable State</text>

  <rect x="92" y="210" width="170" height="78" class="box" />
  <text x="177" y="239" text-anchor="middle" class="label">Business User</text>
  <text x="177" y="263" text-anchor="middle" class="small">uploads data</text>

  <rect x="92" y="348" width="170" height="94" class="box" />
  <text x="177" y="379" text-anchor="middle" class="label">Website Demo</text>
  <text x="177" y="403" text-anchor="middle" class="small">or LLM MCP client</text>
  <text x="177" y="424" text-anchor="middle" class="tiny">thin public surface</text>

  <rect x="400" y="205" width="210" height="92" class="box2" />
  <text x="505" y="236" text-anchor="middle" class="label">MCP / API Facade</text>
  <text x="505" y="260" text-anchor="middle" class="small">sessions, upload, runs</text>
  <text x="505" y="281" text-anchor="middle" class="tiny">stable tool contract</text>

  <rect x="386" y="372" width="112" height="88" class="box3" />
  <text x="442" y="403" text-anchor="middle" class="label">Light</text>
  <text x="442" y="426" text-anchor="middle" class="small">profile</text>
  <text x="442" y="446" text-anchor="middle" class="tiny">seconds</text>

  <rect x="512" y="372" width="112" height="88" class="warn" />
  <text x="568" y="403" text-anchor="middle" class="label">Deep</text>
  <text x="568" y="426" text-anchor="middle" class="small">async</text>
  <text x="568" y="446" text-anchor="middle" class="tiny">minutes</text>

  <rect x="760" y="200" width="210" height="98" class="box2" />
  <text x="865" y="230" text-anchor="middle" class="label">AgentCore Runtime</text>
  <text x="865" y="254" text-anchor="middle" class="small">VirtualDataScientistAgent</text>
  <text x="865" y="276" text-anchor="middle" class="tiny">orchestrates deep work</text>

  <rect x="1000" y="200" width="180" height="98" class="box" />
  <text x="1090" y="230" text-anchor="middle" class="label">AWS Backend</text>
  <text x="1090" y="254" text-anchor="middle" class="small">Lambda Function URL</text>
  <text x="1090" y="276" text-anchor="middle" class="tiny">AWS IAM signed</text>

  <rect x="760" y="378" width="180" height="92" class="box3" />
  <text x="850" y="409" text-anchor="middle" class="label">App State</text>
  <text x="850" y="433" text-anchor="middle" class="small">sessions, runs</text>
  <text x="850" y="454" text-anchor="middle" class="tiny">datasets, audit</text>

  <rect x="1000" y="378" width="180" height="92" class="box3" />
  <text x="1090" y="409" text-anchor="middle" class="label">Artifacts</text>
  <text x="1090" y="433" text-anchor="middle" class="small">reports, code</text>
  <text x="1090" y="454" text-anchor="middle" class="tiny">profiles, metrics</text>

  <rect x="880" y="516" width="180" height="70" class="box2" />
  <text x="970" y="545" text-anchor="middle" class="label">AgentCore Memory</text>
  <text x="970" y="568" text-anchor="middle" class="tiny">future continuity only</text>

  <path class="arrow" d="M177 288 V348" />
  <path class="arrow" d="M262 395 H400" />
  <path class="arrow" d="M505 297 V358" />
  <path class="arrow" d="M470 372 C485 342 790 336 838 298" />
  <path class="arrow" d="M624 416 H735 C735 315 792 314 820 298" />
  <path class="arrow" d="M970 249 H1000" />
  <path class="arrow" d="M1090 298 V364" />
  <path class="arrow" d="M1000 424 H940" />
  <path class="arrow" d="M498 416 H746" />
  <path class="arrow" d="M940 424 H986" />
  <path class="arrow2" d="M865 298 C890 358 940 448 970 516" />
  <path class="arrow" d="M850 470 C760 622 242 590 177 442" />
  <path class="arrow" d="M1090 470 C1016 650 258 640 177 442" />

  <rect x="370" y="622" width="540" height="44" rx="12" fill="#0f172a" stroke="#334155" />
  <text x="640" y="650" text-anchor="middle" class="small">Source of truth stays in application state and artifact storage; agent memory is not the audit record.</text>
</svg>
